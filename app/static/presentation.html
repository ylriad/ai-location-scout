<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Location Scout — Презентация проекта</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b0d17;
      --bg-surface: #141728;
      --card: rgba(22, 26, 46, 0.85);
      --card-border: rgba(108, 99, 255, 0.22);
      --brand: #6c63ff;
      --brand-light: #8b84ff;
      --accent: #00d4aa;
      --accent-coral: #ff6b6b;
      --gold: #ffd700;
      --text: #f0f2fd;
      --muted: #8b8ea8;
      --radius: 18px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      user-select: none;
    }

    /* Ambient glow */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(circle 600px at 15% 15%, rgba(108,99,255,0.12), transparent 70%),
        radial-gradient(circle 500px at 85% 85%, rgba(0,212,170,0.1), transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* TOP BAR */
    header {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.8rem 2.5rem;
      background: rgba(11, 13, 23, 0.88);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--card-border);
    }
    .header-logo {
      display: flex; align-items: center; gap: 0.8rem;
      font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.1rem;
      color: #fff;
    }
    .header-badge {
      background: rgba(108,99,255,0.18); color: var(--brand-light);
      border: 1px solid rgba(108,99,255,0.35); padding: 3px 10px; border-radius: 20px;
      font-size: 0.72rem; font-weight: 600;
    }
    .header-controls {
      display: flex; align-items: center; gap: 1rem;
    }
    .btn-nav {
      background: var(--bg-surface); border: 1px solid var(--card-border);
      color: var(--text); padding: 6px 14px; border-radius: 8px; font-size: 0.82rem;
      font-weight: 600; cursor: pointer; transition: all 0.2s;
    }
    .btn-nav:hover { background: rgba(108,99,255,0.25); border-color: var(--brand); }
    .slide-indicator {
      font-size: 0.85rem; color: var(--muted); font-weight: 600; min-width: 60px; text-align: center;
    }

    /* PROGRESS BAR */
    .progress-bar-container {
      width: 100%; height: 3px; background: rgba(255,255,255,0.06);
    }
    .progress-bar {
      height: 100%; width: 0%; background: linear-gradient(90deg, var(--brand), var(--accent));
      transition: width 0.3s ease;
    }

    /* SLIDE STAGE */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 2rem;
      position: relative;
      z-index: 1;
    }
    .slide-wrapper {
      width: 100%;
      max-width: 1180px;
      min-height: 640px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      box-shadow: 0 16px 50px rgba(0,0,0,0.45);
      backdrop-filter: blur(14px);
      padding: 3rem 3.5rem;
      display: flex;
      flex-direction: column;
      position: relative;
      animation: fadeIn 0.35s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* SLIDE TYPOGRAPHY */
    .slide-tag {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em;
      font-weight: 700; color: var(--accent); margin-bottom: 0.6rem;
    }
    .slide-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.8rem, 3.2vw, 2.5rem);
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 0.8rem;
      background: linear-gradient(135deg, #fff 20%, var(--brand-light) 75%, var(--accent) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .slide-sub {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.5;
      margin-bottom: 2rem;
      max-width: 900px;
    }

    /* CONTENT GRIDS */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; flex: 1; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.5rem; flex: 1; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.2rem; flex: 1; }

    .feature-card {
      background: rgba(14, 17, 32, 0.7);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 1.5rem 1.6rem;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }
    .feature-card:hover {
      transform: translateY(-3px);
      border-color: var(--card-border);
    }
    .feature-card h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.15rem; font-weight: 700; margin-bottom: 0.6rem; color: #fff;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .feature-card p, .feature-card li {
      font-size: 0.92rem; color: var(--muted); line-height: 1.6;
    }
    .feature-card ul { list-style: none; margin-top: 0.5rem; }
    .feature-card li { margin-bottom: 0.4rem; display: flex; align-items: flex-start; gap: 0.5rem; }
    .feature-card li::before { content: '▸'; color: var(--brand-light); font-weight: bold; }

    /* CODE BOX */
    .code-box {
      background: #080911;
      border: 1px solid rgba(108,99,255,0.25);
      border-radius: 12px;
      padding: 1.2rem;
      font-family: 'Fira Code', monospace;
      font-size: 0.85rem;
      color: #cbd5e1;
      line-height: 1.55;
      overflow-x: auto;
    }
    .code-hl-k { color: #f472b6; font-weight: 600; }
    .code-hl-f { color: #38bdf8; font-weight: 600; }
    .code-hl-s { color: #4ade80; }
    .code-hl-c { color: #64748b; font-style: italic; }

    /* SCREENSHOT PLACEHOLDER */
    .screenshot-placeholder {
      background: rgba(11, 14, 28, 0.8);
      border: 2px dashed rgba(108,99,255,0.4);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      min-height: 220px;
      position: relative;
    }
    .screenshot-placeholder svg {
      width: 44px; height: 44px; stroke: var(--brand-light); margin-bottom: 0.8rem; opacity: 0.8;
    }
    .screenshot-placeholder .title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.95rem; font-weight: 700; color: #fff; margin-bottom: 0.3rem;
    }
    .screenshot-placeholder .desc {
      font-size: 0.8rem; color: var(--muted); max-width: 380px;
    }

    /* COMPARISON TABLE */
    table.comp-table {
      width: 100%; border-collapse: collapse; font-size: 0.9rem; margin-top: 0.5rem;
    }
    table.comp-table th, table.comp-table td {
      padding: 1rem 1.2rem; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    table.comp-table th {
      background: rgba(108,99,255,0.12); color: #fff; font-family: 'Space Grotesk', sans-serif; font-size: 0.95rem;
    }
    table.comp-table tr:hover td { background: rgba(255,255,255,0.02); }
    .badge-comp {
      display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700;
    }
    .badge-biz { background: rgba(108,99,255,0.2); color: var(--brand-light); }
    .badge-pers { background: rgba(0,212,170,0.18); color: var(--accent); }

    /* TITLE SLIDE SPECIFIC */
    .title-slide-content {
      margin: auto 0;
      text-align: left;
    }
    .meta-authors {
      margin-top: 2.5rem;
      display: flex;
      gap: 3rem;
      padding-top: 2rem;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .meta-box h4 {
      font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 0.4rem;
    }
    .meta-box p {
      font-family: 'Space Grotesk', sans-serif; font-size: 1.15rem; font-weight: 700; color: #fff;
    }

    /* QR SLIDE */
    .qr-container {
      display: flex; align-items: center; justify-content: center; gap: 3.5rem; flex: 1;
    }
    .qr-card {
      background: #ffffff; padding: 1.2rem; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex; flex-direction: column; align-items: center; width: 230px;
    }
    .qr-box {
      width: 190px; height: 190px; border: 2px dashed #4a42cc; border-radius: 8px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #4a42cc; font-size: 0.78rem; font-weight: 700; text-align: center; padding: 1rem;
      background: #f8f9ff;
    }
    .qr-card span {
      margin-top: 0.8rem; font-size: 0.78rem; font-weight: 700; color: #1e1b4b;
    }

    /* FOOTER CONTROLS */
    footer {
      padding: 1rem 2.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 0.82rem;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .key-hints { display: flex; gap: 1.2rem; }
    .key {
      background: rgba(255,255,255,0.08); padding: 2px 7px; border-radius: 4px; color: #fff; font-size: 0.75rem;
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <header>
    <div class="header-logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M12 2L2 22h20L12 2z"/>
      </svg>
      <span>AI Location Scout</span>
      <span class="header-badge">Торайгыров университет</span>
    </div>
    <div class="header-controls">
      <button class="btn-nav" onclick="prevSlide()">← Назад</button>
      <span class="slide-indicator" id="slideNum">1 / 15</span>
      <button class="btn-nav" onclick="nextSlide()">Вперед →</button>
      <button class="btn-nav" onclick="toggleFullscreen()" title="Полноэкранный режим">⛶</button>
    </div>
  </header>

  <!-- PROGRESS -->
  <div class="progress-bar-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <!-- SLIDE CONTAINER -->
  <main>
    <div class="slide-wrapper" id="slideStage">
      <!-- Slides dynamically rendered here -->
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div>AI Location Scout · Интеллектуальный геоаналитический комплекс</div>
    <div class="key-hints">
      <span>Навигация: <span class="key">←</span> <span class="key">→</span> или <span class="key">Пробел</span></span>
      <span>Полный экран: <span class="key">F</span></span>
    </div>
  </footer>

  <script>
    const slides = [
      // ── SLIDE 1: ТИТУЛЬНЫЙ ──

                  <div style="font-weight:700; color:#fff;">Торайгыров университет, 2026</div>
                </div>
              </div>
            </div>
            
            <div class="qr-card">
              <div class="qr-box">
                <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#4a42cc" stroke-width="2" style="margin-bottom:0.5rem;">
                  <rect x="3" y="3" width="7" height="7"></rect>
                  <rect x="14" y="3" width="7" height="7"></rect>
                  <rect x="14" y="14" width="7" height="7"></rect>
                  <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
                [ МЕСТО ДЛЯ ВАШЕГО QR-КОДА ]
                <br>
                <span style="font-size:0.7rem; color:#64748b; margin-top:4px;">Вставьте изображение QR сюда</span>
              </div>
              <span>Отсканируйте для перехода к сервису</span>
            </div>
          </div>
        `
      }
    ];

    let currentSlide = 0;

    function renderSlide() {
      const s = slides[currentSlide];
      const stage = document.getElementById('slideStage');
      
      stage.style.animation = 'none';
      stage.offsetHeight; // trigger reflow
      stage.style.animation = null;

      stage.innerHTML = `
        <div class="slide-tag">${s.tag}</div>
        <h1 class="slide-title">${s.title}</h1>
        <p class="slide-sub">${s.sub}</p>
        ${s.html}
      `;

      document.getElementById('slideNum').textContent = `${currentSlide + 1} / ${slides.length}`;
      document.getElementById('progressBar').style.width = `${((currentSlide + 1) / slides.length) * 100}%`;
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        renderSlide();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide();
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        prevSlide();
      } else if (e.key.toLowerCase() === 'f') {
        toggleFullscreen();
      } else if (e.key === 'Home') {
        currentSlide = 0;
        renderSlide();
      } else if (e.key === 'End') {
        currentSlide = slides.length - 1;
        renderSlide();
      }
    });

    renderSlide();
  </script>
</body>
</html>
